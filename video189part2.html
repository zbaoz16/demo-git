<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube 18:9 Fullscreen Landscape</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    :root { --bg:#0b0f19; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12); }
    body{
      background: radial-gradient(1000px 500px at 20% 0%, #1b2a6b33, transparent),
                  radial-gradient(900px 600px at 90% 10%, #7c2ae833, transparent),
                  var(--bg);
      color:#fff; min-height:100vh;
    }
    .glass{ background:var(--card); border:1px solid var(--border); border-radius:18px; backdrop-filter: blur(10px); }
    .hint{ font-size:.9rem; color:rgba(255,255,255,.75); }

    /* Khung xem bình thường (portrait 18:9 dọc cho gọn trên điện thoại) */
    .stage{
      width:100%; max-width:520px; margin:0 auto;
      border:1px solid var(--border);
      background:#000; border-radius:18px; overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
    }
    .ratio-18x9-portrait{ position:relative; width:100%; padding-top:200%; } /* 2:1 dọc */
    .ratio-18x9-portrait iframe{
      position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    }

    /* FULLSCREEN WRAPPER: khung 18:9 ngang */
    #fsWrap{
      background:#000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ratio-18x9-landscape{
      position: relative;
      width: min(100vw, 100vh * 2);   /* giữ tỉ lệ 2:1 */
      height: calc(min(100vw, 100vh * 2) / 2);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
    }
    .ratio-18x9-landscape iframe{
      position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    }

    /* Khi đã fullscreen thì bỏ bo góc để “đã” hơn */
    :fullscreen .ratio-18x9-landscape{
      border-radius: 0;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <div class="text-center mb-3">
      <h1 class="h4 fw-bold mb-1">YouTube Fullscreen 18:9 (Landscape)</h1>
      <div class="hint">Dán link YouTube → Xem → Mở toàn màn hình (tự xoay ngang nếu thiết bị hỗ trợ)</div>
      <div class="hint mt-1">
        * Nếu bạn mở bằng <b>file://</b> có thể lỗi. Hãy chạy qua <b>http://</b> (Acode Live Server / GitHub Pages).
      </div>
    </div>

    <div class="glass p-3 mb-3">
      <label class="form-label fw-semibold">Link YouTube</label>
      <div class="input-group">
        <input id="ytUrl" type="url" class="form-control"
               placeholder="Ví dụ: https://youtu.be/itcjJBn5ogE" />
        <button id="watchBtn" class="btn btn-primary">Xem</button>
      </div>

      <div class="d-flex gap-2 mt-2">
        <button id="fsBtn" class="btn btn-outline-light btn-sm" disabled>Mở toàn màn hình (xoay ngang)</button>
      </div>
    </div>

    <!-- Khung xem bình thường -->
    <div class="stage mb-3">
      <div class="ratio-18x9-portrait">
        <iframe id="ytFrame" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen src=""></iframe>
      </div>
    </div>
  </div>

  <!-- Fullscreen wrapper (ẩn trong trang, nhưng sẽ được requestFullscreen) -->
  <div id="fsWrap" hidden>
    <div class="ratio-18x9-landscape">
      <iframe id="ytFrameFs" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen src=""></iframe>
    </div>
  </div>

  <script>
    const ytUrl = document.getElementById('ytUrl');
    const watchBtn = document.getElementById('watchBtn');
    const fsBtn = document.getElementById('fsBtn');

    const ytFrame = document.getElementById('ytFrame');
    const fsWrap = document.getElementById('fsWrap');
    const ytFrameFs = document.getElementById('ytFrameFs');

    // Cảnh báo file:// (rất hay lỗi YouTube embed)
    if (location.protocol === "file:") {
      alert("Bạn đang mở bằng file:// (mở file HTML trực tiếp). YouTube embed rất hay lỗi. Hãy chạy bằng http:// (Acode Live Server) hoặc host (GitHub Pages).");
    }

    function extractYouTubeId(input) {
      const url = (input || '').trim();
      if (!url) return null;

      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

      try {
        const u = new URL(url);

        if (u.hostname.includes('youtu.be')) {
          return u.pathname.split('/').filter(Boolean)[0] || null;
        }

        const v = u.searchParams.get('v');
        if (v) return v;

        const parts = u.pathname.split('/').filter(Boolean);
        const shorts = parts.indexOf('shorts');
        if (shorts !== -1 && parts[shorts + 1]) return parts[shorts + 1];

        const embed = parts.indexOf('embed');
        if (embed !== -1 && parts[embed + 1]) return parts[embed + 1];

        return null;
      } catch (e) {
        return null;
      }
    }

    function buildEmbedUrl(videoId) {
      const base = `https://www.youtube-nocookie.com/embed/${videoId}`;
      const params = new URLSearchParams({
        controls: "1",
        playsinline: "1",
        rel: "0",
        modestbranding: "1"
      });

      // origin chỉ thêm khi chạy http/https
      if (location.origin && location.origin.startsWith("http")) {
        params.set("origin", location.origin);
      }
      return `${base}?${params.toString()}`;
    }

    watchBtn.addEventListener('click', () => {
      const id = extractYouTubeId(ytUrl.value);
      if (!id) {
        alert("Link YouTube không hợp lệ. Dán watch?v=..., youtu.be/..., shorts/... hoặc ID 11 ký tự.");
        return;
      }
      const src = buildEmbedUrl(id);
      ytFrame.src = src;
      fsBtn.disabled = false;
    });

    async function openFullscreenLandscape() {
      if (!ytFrame.src) return;

      // Đưa src sang iframe fullscreen (để không bị 2 nơi cùng load)
      ytFrameFs.src = ytFrame.src;

      // Hiện wrapper trước khi fullscreen
      fsWrap.hidden = false;

      // Fullscreen thật (hệ thống)
      try {
        await fsWrap.requestFullscreen();
      } catch (e) {
        alert("Thiết bị/trình duyệt không cho Fullscreen. Bạn thử cập nhật Chrome hoặc mở bằng http/https.");
        fsWrap.hidden = true;
        return;
      }

      // Khóa landscape (chỉ có thể hoạt động sau khi vào fullscreen)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (e) {
        // Nếu không hỗ trợ thì vẫn fullscreen bình thường
        console.log("Không lock landscape được:", e);
      }
    }

    fsBtn.addEventListener('click', openFullscreenLandscape);

    // Khi thoát fullscreen: unlock + ẩn wrapper + dừng iframe fullscreen
    document.addEventListener('fullscreenchange', async () => {
      if (!document.fullscreenElement) {
        try {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        } catch (e) {}

        // Tắt iframe fullscreen để đỡ chạy nền
        ytFrameFs.src = "";
        fsWrap.hidden = true;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
